<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shopee Aff Link Converter</title>
  <!-- Tải cấu hình từ config.js — điền cookie/token vào file đó -->
  <script src="config.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px 16px;
    }

    h1       { font-size: 22px; font-weight: 700; color: #ee4d2d; margin-bottom: 4px; }
    .subtitle { font-size: 13px; color: #888; margin-bottom: 24px; }

    /* Banner trạng thái cấu hình */
    .config-banner {
      width: 100%; max-width: 680px;
      padding: 10px 16px; border-radius: 8px;
      font-size: 13px; margin-bottom: 16px;
      display: flex; align-items: center; gap: 8px;
    }
    .config-ok  { background: #e8f5e9; color: #2e7d32; border: 1px solid #a5d6a7; }
    .config-err { background: #fce4ec; color: #b71c1c; border: 1px solid #ef9a9a; }

    /* Card trắng bao quanh các section */
    .card {
      background: #fff; border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      padding: 24px; width: 100%; max-width: 680px; margin-bottom: 16px;
    }

    label { display: block; font-size: 13px; font-weight: 600; color: #333; margin-bottom: 6px; }

    textarea {
      width: 100%; border: 1px solid #ddd; border-radius: 8px;
      padding: 10px 12px; font-size: 14px; color: #222;
      resize: vertical; outline: none; transition: border-color 0.2s;
    }
    textarea:focus { border-color: #ee4d2d; }

    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 10px 20px; border: none; border-radius: 8px;
      font-size: 14px; font-weight: 600; cursor: pointer; transition: opacity 0.15s;
    }
    .btn:hover    { opacity: 0.85; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-primary   { background: #ee4d2d; color: #fff; }
    .btn-secondary { background: #f0f0f0; color: #333; }
    .btn-copy      { background: #4caf50; color: #fff; font-size: 12px; padding: 6px 12px; }
    .btn-row { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }

    /* Bảng kết quả chi tiết */
    .result-table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 12px; }
    .result-table th {
      background: #fef2ef; color: #ee4d2d;
      padding: 8px 12px; text-align: left;
      font-weight: 600; border-bottom: 2px solid #ee4d2d22;
    }
    .result-table td { padding: 8px 12px; border-bottom: 1px solid #f0f0f0; vertical-align: middle; }
    .result-table tr:last-child td { border-bottom: none; }
    .result-table tr:hover td { background: #fafafa; }
    .link-cell { word-break: break-all; font-family: monospace; font-size: 12px; color: #1a73e8; }
    .orig-cell { word-break: break-all; font-size: 12px; color: #666; }

    /* Badge trạng thái từng link */
    .status-badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: 600; }
    .badge-ok   { background: #e8f5e9; color: #2e7d32; }
    .badge-err  { background: #fce4ec; color: #b71c1c; }
    .badge-warn { background: #fff8e1; color: #f57f17; }
    .badge-wait { background: #e3f2fd; color: #1565c0; }

    /* Hộp thông báo tổng kết sau khi xử lý xong */
    .summary-box { border-radius: 8px; padding: 12px 16px; font-size: 13px; margin-bottom: 14px; line-height: 1.6; }
    .summary-ok   { background: #e8f5e9; color: #2e7d32; border: 1px solid #a5d6a7; }
    .summary-warn { background: #fff8e1; color: #e65100; border: 1px solid #ffe082; }

    /* Thanh tiến trình */
    .progress-bar-wrap { width: 100%; height: 4px; background: #f0f0f0; border-radius: 2px; margin-top: 12px; overflow: hidden; display: none; }
    .progress-bar      { height: 100%; background: #ee4d2d; width: 0%; transition: width 0.3s ease; border-radius: 2px; }

    .section-title { font-size: 15px; font-weight: 700; color: #333; margin-bottom: 14px; }
    .detail-title  { font-size: 13px; font-weight: 600; color: #666; margin-top: 20px; margin-bottom: 4px; }

    #converted-text    { background: #f9f9f9; font-size: 13px; color: #222; }
    #bulk-output-section { display: none; }
  </style>
</head>
<body>
  <h1>Shopee Aff Link Converter</h1>
  <p class="subtitle">Tự động chuyển link Shopee → link affiliate của bạn</p>

  <!-- Banner hiển thị trạng thái cấu hình (xanh = OK, đỏ = chưa điền config.js) -->
  <div id="config-banner" class="config-banner config-err">
    ⚠️ Chưa cấu hình — vui lòng điền thông tin vào <b>config.js</b>
  </div>

  <!-- Ô nhập liệu -->
  <div class="card">
    <div class="section-title">Chuyển đổi link trong đoạn văn bản</div>
    <label for="bulk-input">Dán đoạn giới thiệu sản phẩm — tool tự nhận diện và thay thế tất cả link Shopee</label>
    <textarea id="bulk-input" rows="8" placeholder="Ví dụ:&#10;&#10;Sản phẩm hot đang sale 50%! Mua ngay tại https://s.shopee.vn/xxxxx trước khi hết hàng.&#10;Xem thêm combo tại https://s.shopee.vn/yyyyy nhé!"></textarea>
    <div class="btn-row">
      <button class="btn btn-primary" id="btn-bulk" onclick="convertBulk()">Chuyển đổi</button>
      <button class="btn btn-secondary" onclick="clearBulk()">Xóa</button>
    </div>
    <!-- Thanh tiến trình — hiện trong lúc xử lý, ẩn sau khi xong -->
    <div class="progress-bar-wrap" id="progress-wrap">
      <div class="progress-bar" id="progress-bar"></div>
    </div>
  </div>

  <!-- Kết quả — chỉ hiện sau khi nhấn Chuyển đổi -->
  <div class="card" id="bulk-output-section">
    <div class="section-title">Kết quả (<span id="result-count">0</span> link)</div>

    <!-- Thông báo tổng kết: tất cả OK hoặc liệt kê link lỗi/không đổi -->
    <div id="summary-box" class="summary-box" style="display:none;"></div>

    <label for="converted-text">Nội dung sau khi thay link aff</label>
    <textarea id="converted-text" rows="8" readonly></textarea>
    <div class="btn-row">
      <button class="btn btn-copy" onclick="copyConvertedText(this)">Sao chép nội dung</button>
      <button class="btn btn-secondary" onclick="exportCsv()">Export CSV</button>
    </div>

    <!-- Bảng chi tiết từng link -->
    <div class="detail-title">Chi tiết từng link (<span id="link-detail-count">0</span>)</div>
    <table class="result-table">
      <thead>
        <tr>
          <th>#</th>
          <th>Link gốc</th>
          <th>Link aff của bạn</th>
          <th>Trạng thái</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="result-tbody"></tbody>
    </table>
  </div>

  <script>
    // ============================================================
    //  KIỂM TRA CẤU HÌNH
    // ============================================================

    // Trả về true nếu config.js đã được điền cookie
    function isConfigured() {
      return typeof CONFIG !== 'undefined'
        && CONFIG.cookie && CONFIG.cookie.trim() !== '';
    }

    // Cập nhật banner và trạng thái nút khi tải trang
    function initBanner() {
      const banner = document.getElementById('config-banner');
      if (isConfigured()) {
        banner.className = 'config-banner config-ok';
        banner.textContent = '✓ Đã cấu hình — Sẵn sàng chuyển đổi link';
      } else {
        banner.className = 'config-banner config-err';
        banner.textContent = '⚠️ Chưa cấu hình — vui lòng điền cookie vào config.js';
      }
      document.getElementById('btn-bulk').disabled = !isConfigured();
    }

    // ============================================================
    //  XỬ LÝ URL SHOPEE
    // ============================================================

    // Nhận diện loại URL Shopee và trích xuất shopId + itemId
    // Hỗ trợ 3 dạng URL phổ biến:
    //   - /product/{shopId}/{itemId}
    //   - tên-sản-phẩm-i.{shopId}.{itemId}
    //   - ?shopid=xxx&itemid=yyy
    // Trả về { type: 'short'|'ok'|'error', ... }
    function parseShopeeUrl(url) {
      try {
        url = url.trim();
        const u    = new URL(url);
        const host = u.hostname.replace('www.', '');

        // Short link — cần resolve thêm để lấy URL thật
        if (host === 's.shopee.vn' || host === 'shp.ee') return { type: 'short', url };
        if (!host.includes('shopee.')) return { type: 'error', msg: 'Không phải link Shopee' };

        const byPath  = u.pathname.match(/\/product\/(\d+)\/(\d+)/);
        if (byPath) return { type: 'ok', shopId: byPath[1], itemId: byPath[2] };

        const bySlug  = u.pathname.match(/-i\.(\d+)\.(\d+)(?:$|[?#])/);
        if (bySlug) return { type: 'ok', shopId: bySlug[1], itemId: bySlug[2] };

        const shopId = u.searchParams.get('shopid') || u.searchParams.get('shopId');
        const itemId = u.searchParams.get('itemid') || u.searchParams.get('itemId');
        if (shopId && itemId) return { type: 'ok', shopId, itemId };

        return { type: 'error', msg: 'Không tìm thấy ID sản phẩm trong link' };
      } catch {
        return { type: 'error', msg: 'URL không hợp lệ' };
      }
    }

    // Resolve short link (s.shopee.vn) → URL sản phẩm đầy đủ
    // Dùng allorigins.win làm CORS proxy chỉ để follow redirect — không gửi credentials
    async function resolveShortLink(shortUrl) {
      const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(shortUrl)}`;
      const resp = await fetch(proxyUrl, {
        signal: AbortSignal.timeout(CONFIG.request_timeout_ms || 10000)
      });
      if (!resp.ok) throw new Error('Không thể resolve short link: ' + resp.status);
      const data = await resp.json();

      // allorigins trả URL cuối trong status.url
      if (data?.status?.url) return data.status.url;

      // Fallback: đọc canonical tag trong HTML
      const html = data?.contents || '';
      const canonical =
        html.match(/<link[^>]+rel=["']canonical["'][^>]+href=["']([^"']+)["']/i)?.[1] ||
        html.match(/property=["']og:url["'][^>]+content=["']([^"']+)["']/i)?.[1];
      if (canonical) return canonical;

      throw new Error('Không đọc được URL từ short link');
    }

    // Gọi /api/proxy để tạo link affiliate cho 1 URL sản phẩm
    // /api/proxy là Vercel Function — chuyển tiếp request tới affiliate.shopee.vn
    // kèm theo cookie/token từ config.js
    async function generateAffLink(productUrl) {
      const body = JSON.stringify({
        operationName: 'batchGetCustomLink',
        query: `
          query batchGetCustomLink($linkParams: [CustomLinkParam!], $sourceCaller: SourceCaller){
            batchCustomLink(linkParams: $linkParams, sourceCaller: $sourceCaller){
              shortLink
              longLink
              failCode
            }
          }
        `,
        variables: {
          linkParams: [{
            originalLink:       productUrl,
            advancedLinkParams: {},
            sourceCaller:       'CUSTOM_LINK_CALLER',
          }],
          sourceCaller: 'CUSTOM_LINK_CALLER',
        }
      });

      const resp = await fetch('/api/proxy', {
        method: 'POST',
        headers: {
          'Content-Type':    'application/json',
          'X-Cookie':        CONFIG.cookie,
          'X-Csrf-Token':    CONFIG.csrf_token,
          'X-Af-Enc-Token':  CONFIG.af_enc_sz_token,
          'X-Af-Enc-Dat':    CONFIG.af_enc_dat,
        },
        body,
        signal: AbortSignal.timeout(CONFIG.request_timeout_ms || 10000),
      });

      if (!resp.ok) throw new Error('Lỗi server: HTTP ' + resp.status);

      let json;
      try { json = await resp.json(); } catch { throw new Error('Phản hồi không hợp lệ từ server'); }

      // Shopee trả về lỗi xác thực dạng { code, message } hoặc { error }
      if (json?.code && json.code !== 0) throw new Error('Shopee lỗi ' + json.code + ': ' + (json.message || 'xác thực thất bại — cập nhật cookie/token trong config.js'));
      if (json?.error) throw new Error('Shopee lỗi: ' + json.error);

      const item = json?.data?.batchCustomLink?.[0];
      if (!item) throw new Error('Không nhận được link từ Shopee — có thể cookie/token hết hạn, kiểm tra lại config.js');
      if (item.failCode !== 0) throw new Error('Shopee báo lỗi: failCode ' + item.failCode);

      return CONFIG.link_type === 'short' ? item.shortLink : item.longLink;
    }

    // Pipeline đầy đủ: URL thô bất kỳ → link affiliate
    // Bước 1: Nếu là short link → resolve ra URL thật
    // Bước 2: Parse lấy shopId + itemId → tạo URL chuẩn
    // Bước 3: Gọi API tạo link affiliate
    async function processUrl(rawUrl) {
      let url = rawUrl.trim();
      if (!url) throw new Error('Link trống');

      let parsed = parseShopeeUrl(url);

      if (parsed.type === 'short') {
        const resolved = await resolveShortLink(url);
        parsed = parseShopeeUrl(resolved);
        if (parsed.type === 'short') throw new Error('Short link trỏ đến short link khác');
      }

      if (parsed.type === 'error') throw new Error(parsed.msg);

      const cleanUrl = `https://shopee.vn/product/${parsed.shopId}/${parsed.itemId}`;
      const affLink  = await generateAffLink(cleanUrl);

      return { affLink };
    }

    // ============================================================
    //  NHẬN DIỆN URL TRONG VĂN BẢN
    // ============================================================

    // Regex khớp tất cả dạng URL Shopee trong một đoạn văn bản
    function getShopeeUrlRegex() {
      return /https?:\/\/(?:s\.shopee\.vn|shp\.ee|(?:www\.)?shopee\.[a-z]+(?:\.[a-z]+)?)[^\s]*/g;
    }

    // Cắt bỏ dấu câu thừa ở cuối URL (dấu phẩy, chấm, chấm than, v.v.)
    function trimTrailing(url) {
      return url.replace(/[.,;!?)'"\]>]+$/, '');
    }

    // Trích xuất tất cả URL Shopee duy nhất trong đoạn văn bản
    function extractUrls(text) {
      const re   = getShopeeUrlRegex();
      const seen = new Set();
      const urls = [];
      let match;
      while ((match = re.exec(text)) !== null) {
        const url = trimTrailing(match[0]);
        if (!seen.has(url)) { seen.add(url); urls.push(url); }
      }
      return urls;
    }

    // Thay thế tất cả URL Shopee trong văn bản bằng link aff tương ứng
    // linkMap: { urlGoc: affLink } — nếu affLink là null thì giữ nguyên URL gốc
    function buildConvertedText(originalText, linkMap) {
      return originalText.replace(getShopeeUrlRegex(), (match) => {
        const trailing = match.slice(trimTrailing(match).length);
        const url      = trimTrailing(match);
        return (url in linkMap && linkMap[url] != null)
          ? linkMap[url] + trailing
          : match;
      });
    }

    // ============================================================
    //  GIAO DIỆN — XỬ LÝ CHÍNH
    // ============================================================

    let bulkResults = []; // Lưu kết quả để export CSV

    async function convertBulk() {
      if (!isConfigured()) return;

      const inputText = document.getElementById('bulk-input').value;
      if (!inputText.trim()) return;

      const urls = extractUrls(inputText);
      if (!urls.length) {
        alert('Không tìm thấy link Shopee nào trong văn bản.');
        return;
      }

      // Reset UI
      const tbody      = document.getElementById('result-tbody');
      const section    = document.getElementById('bulk-output-section');
      const pWrap      = document.getElementById('progress-wrap');
      const pBar       = document.getElementById('progress-bar');
      const countSpan  = document.getElementById('result-count');
      const detailSpan = document.getElementById('link-detail-count');
      const btn        = document.getElementById('btn-bulk');

      tbody.innerHTML = '';
      bulkResults     = [];
      section.style.display  = 'block';
      pWrap.style.display    = 'block';
      pBar.style.width       = '0%';
      countSpan.textContent  = urls.length;
      detailSpan.textContent = urls.length;
      btn.disabled    = true;
      btn.textContent = 'Đang xử lý...';

      const concurrency = CONFIG.bulk_concurrency || 2;
      const delay       = CONFIG.bulk_delay_ms    || 500;
      const linkMap     = {};

      // Tạo sẵn các hàng trong bảng với trạng thái "Đợi..."
      const rows = urls.map((url, i) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${i + 1}</td>
          <td class="orig-cell">${truncate(url, 45)}</td>
          <td>—</td>
          <td><span class="status-badge badge-wait">Đợi...</span></td>
          <td></td>`;
        tbody.appendChild(tr);
        return tr;
      });

      let done = 0;

      // Xử lý 1 link: gọi API → cập nhật hàng tương ứng trong bảng
      async function processOne(i) {
        const url   = urls[i];
        const cells = rows[i].querySelectorAll('td');
        cells[3].innerHTML = '<span class="status-badge badge-wait">Đang xử lý...</span>';

        try {
          const { affLink } = await processUrl(url);
          const unchanged   = affLink === url;
          linkMap[url]      = affLink;
          bulkResults[i]    = { original: url, affLink, ok: true, unchanged };

          cells[2].innerHTML = `<span class="link-cell">${affLink}</span>`;
          cells[3].innerHTML = unchanged
            ? '<span class="status-badge badge-warn">Không đổi</span>'
            : '<span class="status-badge badge-ok">OK</span>';
          cells[4].innerHTML = `<button class="btn btn-copy" onclick="copyText('${affLink}',this)">Copy</button>`;

        } catch (e) {
          linkMap[url]   = null;
          bulkResults[i] = { original: url, affLink: null, error: e.message, ok: false };
          cells[2].innerHTML = `<span style="color:#e53935;font-size:12px;">${e.message}</span>`;
          cells[3].innerHTML = '<span class="status-badge badge-err">Lỗi</span>';
        }

        done++;
        pBar.style.width = (done / urls.length * 100) + '%';
        // Cập nhật textarea kết quả ngay sau mỗi link, không cần đợi xong hết
        document.getElementById('converted-text').value = buildConvertedText(inputText, linkMap);
      }

      // Xử lý theo batch để tránh gửi quá nhiều request cùng lúc
      for (let i = 0; i < urls.length; i += concurrency) {
        const batch = urls.slice(i, i + concurrency).map((_, j) => processOne(i + j));
        await Promise.all(batch);
        if (i + concurrency < urls.length) await sleep(delay);
      }

      pWrap.style.display = 'none';
      btn.disabled        = false;
      btn.textContent     = 'Chuyển đổi';
      showSummary();
    }

    // Hiển thị hộp tổng kết sau khi xử lý xong tất cả link
    function showSummary() {
      const box       = document.getElementById('summary-box');
      const errors    = bulkResults.filter(r => r && !r.ok);
      const unchanged = bulkResults.filter(r => r && r.ok && r.unchanged);

      if (!errors.length && !unchanged.length) {
        box.className   = 'summary-box summary-ok';
        box.textContent = `✓ Tất cả ${bulkResults.filter(r => r?.ok).length} link đã được chuyển đổi thành công.`;
      } else {
        const lines = ['⚠️ Có vấn đề với một số link:'];
        if (errors.length)    lines.push(`• ${errors.length} link lỗi — không thể chuyển đổi (xem bảng bên dưới).`);
        if (unchanged.length) lines.push(`• ${unchanged.length} link không đổi — có thể link không hợp lệ hoặc cookie hết hạn.`);
        box.className = 'summary-box summary-warn';
        box.innerHTML = lines.join('<br>');
      }
      box.style.display = 'block';
    }

    // Xóa toàn bộ input và kết quả
    function clearBulk() {
      document.getElementById('bulk-input').value          = '';
      document.getElementById('converted-text').value      = '';
      document.getElementById('result-tbody').innerHTML    = '';
      document.getElementById('summary-box').style.display = 'none';
      document.getElementById('bulk-output-section').style.display = 'none';
      bulkResults = [];
    }

    // Sao chép toàn bộ nội dung đã thay link aff vào clipboard
    function copyConvertedText(btn) {
      const text = document.getElementById('converted-text').value;
      if (!text) return alert('Chưa có nội dung để sao chép.');
      navigator.clipboard.writeText(text).then(() => {
        const orig = btn.textContent;
        btn.textContent = 'Đã sao chép!';
        setTimeout(() => btn.textContent = orig, 1500);
      });
    }

    // Xuất file CSV chứa danh sách link gốc và link aff tương ứng
    function exportCsv() {
      if (!bulkResults.length) return;
      const rows = [['#', 'Link gốc', 'Link aff', 'Trạng thái']];
      bulkResults.forEach((r, i) => {
        if (r) rows.push([i + 1, r.original, r.affLink || '', r.ok ? 'OK' : r.error]);
      });
      const csv  = rows.map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(',')).join('\n');
      const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' });
      const a    = document.createElement('a');
      a.href     = URL.createObjectURL(blob);
      a.download = 'shopee-aff-links.csv';
      a.click();
    }

    // ============================================================
    //  TIỆN ÍCH
    // ============================================================

    function copyText(text, btn) {
      navigator.clipboard.writeText(text).then(() => {
        const orig = btn.textContent;
        btn.textContent = 'Đã sao chép!';
        setTimeout(() => btn.textContent = orig, 1500);
      });
    }

    function truncate(str, n) { return str.length > n ? str.slice(0, n) + '…' : str; }
    function sleep(ms)        { return new Promise(r => setTimeout(r, ms)); }

    // Khởi động: kiểm tra config và cập nhật banner
    initBanner();
  </script>
